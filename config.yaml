model_list:
  - model_name: gemma3-4b # The name you use in litellm.completion
    litellm_params:
      model: ollama/gemma3:4b # The actual model identifier for the provider
      api_base: "http://192.168.0.34:11434" # Default, change if needed

  - model_name: deepseek-r1-8b # The name you use in litellm.completion
    litellm_params:
      model: ollama/deepseek-r1:latest # The actual model identifier for the provider
      api_base: "http://0.0.0.0:11434" # Default, change if needed

  - model_name: qwen2.5-coder
    litellm_params:
      model: ollama/qwen2.5-coder:1.5b
      api_base: "http://192.168.0.34:11434"

  - model_name: codellama
    litellm_params:
      model: ollama/codellama:latest
      api_base: "http://192.168.0.34:11434"

  - model_name: ollama/qwen2.5vl
    litellm_params:
      model: ollama/qwen2.5vl:3b
      api_base: "http://192.168.0.34:11434"

  - model_name: ollama/qwen3
    litellm_params:
      model: ollama/qwen3:8b
      api_base: "http://0.0.0.0:11434"

  - model_name: ollama/nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: "http://127.0.0.1:11434"
      drop_params: "true"

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-2.5-flash-lite  # User-facing name
    litellm_params:
      model: gemini/gemini-2.5-flash-lite # Internal LiteLLM model string
      api_key: os.environ/GEMINI_API_KEY # Reference the environment variable

  - model_name: gemini-gemma=27b  # User-facing name
    litellm_params:
      model: gemini/gemma-3-27b-it # Internal LiteLLM model string
      api_key: os.environ/GEMINI_API_KEY # Reference the environment variable

litellm_settings:
  drop_params: True
  set_verbose: True

general_settings:
  # Optional: Set global settings like timeouts
  # timeout: 300 # 5 minutes

# You can define custom environment variables within the config too
environment_variables:
  OPENAI_API_KEY: "" # Define placeholders or actual keys (less secure)
  GEMINI_API_KEY: ""
